[project]
name = "ipac-tax-synch"
version = "0.1.0"
description = "IPAC Tax Sync — Databricks pipeline: SQL Server → aggregate compute → SQL Server + Lakebase"
requires-python = ">=3.12"

dependencies = [
    "psycopg2-binary>=2.9.9",       # Lakebase (Postgres) connections
    "pydantic>=2.0.0",               # config validation
    "python-dotenv>=1.0.0",          # local .env support
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",                   # linting + formatting
    "mypy>=1.10.0",                  # type checking
]

databricks = [
    "databricks-sdk>=0.28.0",        # Databricks SDK (jobs, secrets, clusters)
    "databricks-connect>=15.0.0",    # Spark connect from local IDE
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
include = [
    "src/**/*.py",
    "src/**/*.sql",                  # include SQL templates
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]     # pycodestyle, pyflakes, isort, pyupgrade
ignore = ["E501"]                   # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["src", "config"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit   = ["tests/*", "config/*"]