# =============================================================================
# Lakeflow Connect — tax_audit CDC (40 tables, custom liquid clustering)
#
# Source     : free-sql-db-0862313.tax_audit
# Tables     : 20 from tax_audit_create_20_tables.sql
#              + 20 from tax_audit_create_another_20_tables.sql
# Destination: ipac_tax_synch.client_a_raw_auto
#
# Liquid Clustering — users_1 pattern (non-PK clustering_columns):
#   All 40 tables -> entity_id, period_id  (cols 1, 2 in shared template)
#
# Schedule: continuous (pipeline runs until stopped).
#
# SQL prerequisite:
#   tax_audit_create_20_tables.sql + tax_audit_create_another_20_tables.sql
#   tax_audit_enable_change_tracking_40_tables.sql
# =============================================================================

resources:
  pipelines:
    tax_audit_40_tables_lq_cont:
      name: tax_audit_40_tables_lq_cont
      tags:
        client_name: ${var.client_id}
      pipeline_type: MANAGED_INGESTION
      channel: PREVIEW
      serverless: true
      continuous: true
      development: false
      catalog: ${var.dest_catalog}
      schema: ${var.dest_schema}
      ingestion_definition:
        connection_name: ${var.connection_name}
        connector_type: CDC
        table_configuration:
          enable_auto_clustering: true
        data_staging_options:
          catalog_name: ${var.dest_catalog}
          schema_name: ${var.staging_schema}
        objects:
          # --- batch 1 (20 tables) ---
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: tax_audit
              source_table: audit_engagement
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
              table_configuration:
                clustering_columns: [entity_id, period_id]
