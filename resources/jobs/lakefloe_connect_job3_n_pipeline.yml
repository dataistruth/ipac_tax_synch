# =============================================================================
# resources/jobs/auto_cdc_ingestion_3_slim.yml
#
# Lakeflow Connect — Integrated CDC pipeline #3 (Beta) for Client A
# Scope: the two wide fact tables with COLUMN FILTERING via include_columns —
# only 30 important columns + PK, so the PK lands within the first 32 columns
# of the destination schema. Control case for the clustering-key test.
#
# Destination tables are suffixed _slim so they don't collide with the
# full-width copies written by auto_cdc_ingestion_2_pipeline.
#
# NOTE: Variables are defined once in lakeflow_connect_job_n_pipeline.yml
# and shared bundle-wide — do NOT redefine them here.
# =============================================================================
resources:
  pipelines:
    auto_cdc_ingestion_3_pipeline:
      name: ${var.client_id}_auto_cdc_ingestion_3_slim
      tags:
        client_name: ${var.client_id}
      pipeline_type: MANAGED_INGESTION
      channel: PREVIEW
      serverless: true
      catalog: ${var.dest_catalog}
      schema: ${var.dest_schema}
      ingestion_definition:
        connection_name: ${var.connection_name}
        connector_type: CDC
        data_staging_options:
          catalog_name: ${var.dest_catalog}
          schema_name: ${var.staging_schema}
        objects:
          # ------------------------------------------------------------------
          # fact_gl_line_detail → fact_gl_line_detail_slim (30 cols incl. PK)
          # ------------------------------------------------------------------
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: fact_gl_line_detail
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
              destination_table: fact_gl_line_detail_slim
              table_configuration:
                include_columns:
                  - gl_line_id          # PK — must be included
                  - entity_id
                  - period_id
                  - partner_id
                  - account_code
                  - account_type
                  - transaction_date
                  - posting_date
                  - fiscal_year
                  - fiscal_quarter
                  - fiscal_month
                  - journal_source
                  - reference_no
                  - description
                  - debit_amount
                  - credit_amount
                  - net_amount
                  - base_currency
                  - exchange_rate
                  - base_amount
                  - tax_amount
                  - m1_adjustment
                  - state_amount
                  - federal_amount
                  - department_code
                  - cost_center
                  - source_system
                  - created_at
                  - updated_at
                  - is_active
          # ------------------------------------------------------------------
          # fact_k1_allocation_detail → fact_k1_allocation_detail_slim
          # ------------------------------------------------------------------
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: fact_k1_allocation_detail
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
              destination_table: fact_k1_allocation_detail_slim
              table_configuration:
                include_columns:
                  - k1_line_id          # PK — must be included
                  - entity_id
                  - partner_id
                  - period_id
                  - tax_year
                  - allocation_method
                  - ownership_pct
                  - profit_pct
                  - loss_pct
                  - capital_pct
                  - ordinary_income
                  - rental_income
                  - interest_income
                  - dividend_income
                  - st_capital_gain
                  - lt_capital_gain
                  - sec1231_gain
                  - other_income
                  - sec179_deduction
                  - charitable_contrib
                  - other_deductions
                  - se_earnings
                  - credits_amount
                  - distributions_cash
                  - capital_beginning
                  - capital_contributed
                  - capital_ending
                  - state_source_code
                  - created_at
                  - is_final

  jobs:
    auto_cdc_ingestion_3_job:
      name: job_${var.client_id}_auto_cdc_ingestion_3_slim
      tags:
        client_name: ${var.client_id}
      tasks:
        - task_key: cdc_ingestion_slim_facts
          pipeline_task:
            pipeline_id: ${resources.pipelines.auto_cdc_ingestion_3_pipeline.id}
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: false
      schedule:
        quartz_cron_expression: '0 0 * * * ?'
        timezone_id: UTC
        pause_status: PAUSED                  # test pipeline: trigger manually
      max_concurrent_runs: 1