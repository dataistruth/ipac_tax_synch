# =============================================================================
# Lakeflow Connect — 15-table limited CDC (sales_demo / etl_reader)
#
# Connection : sql_server_del_con2_ipac
# Source     : free-sql-db-0862313.sales_demo
# Destination: ipac_tax_synch.client_a_raw_auto
#
# SQL setup (run once on Azure SQL before first pipeline run):
#   config/clients/client_a/sql/sales_demo_etl_reader_15_tables_ct.sql
#   - change tracking on database + 15 tables only
#   - etl_reader: SELECT + VIEW CHANGE TRACKING per table (no schema-wide grant)
#
# 15 tables IN pipeline (etl_reader allowed):
#   customers, products, stores, employees, orders, order_items,
#   payments, shipments, inventory, suppliers, purchase_orders,
#   promotions, customer_addresses, product_reviews, returns
#
# 5 tables EXCLUDED (not in pipeline, DENY SELECT for etl_reader):
#   employee_salaries, customer_payment_methods, audit_log,
#   internal_costs, vendor_contracts
#
# Liquid Clustering (Lakeflow Connect CDC — Databricks engineering guidance):
#   ingestion_definition.table_configuration.enable_auto_clustering: true  (pipeline default)
#   Per-table clustering_columns for explicit keys (users_1 pattern)
#   Per-table enable_auto_clustering: false to opt out (5 tables below)
#   Tables with no table_configuration inherit AUTO (calendar_test pattern)
#
#   ALTER TABLE ... CLUSTER BY is NOT supported on CDC streaming tables.
#   Min DBR for liquid clustering: 13.3. CDC only; SaaS/QBC not supported.
#   Ref: https://docs.databricks.com/aws/en/tables/clustering
#
# NOTE: Uses del_con2_* variable names so this file does not override
#       connection_name / source_schema for other Lakeflow jobs in the bundle.
# =============================================================================

variables:
  del_con2_client_id:
    description: 'Client identifier for limited-perm CDC job'
    default: client_a
  del_con2_connection_name:
    description: 'UC connection for etl_reader SQL Server login'
    default: sql_server_del_con2_ipac
  del_con2_source_catalog:
    description: 'Source SQL Server database name'
    default: free-sql-db-0862313
  del_con2_source_schema:
    description: 'Source schema (15 tables only)'
    default: sales_demo
  del_con2_dest_catalog:
    description: 'Destination Unity Catalog catalog'
    default: ipac_tax_synch
  del_con2_dest_schema:
    description: 'Destination schema for raw synced tables'
    default: client_a_raw_auto
  del_con2_staging_schema:
    description: 'Schema for the CDC staging volume'
    default: client_a_staging_auto

resources:
  pipelines:
    client_a_del_con2_cdc_pipeline:
      name: ${var.del_con2_client_id}_del_con2_integrated_cdc
      tags:
        client_name: ${var.del_con2_client_id}
      pipeline_type: MANAGED_INGESTION
      channel: PREVIEW
      serverless: true
      catalog: ${var.del_con2_dest_catalog}
      schema: ${var.del_con2_dest_schema}
      ingestion_definition:
        connection_name: ${var.del_con2_connection_name}
        connector_type: CDC
        data_staging_options:
          catalog_name: ${var.del_con2_dest_catalog}
          schema_name: ${var.del_con2_staging_schema}
        objects:
          # 15 tables — must match sales_demo_etl_reader_15_tables_ct.sql
          - table:
              source_catalog: ${var.del_con2_source_catalog}
              source_schema: ${var.del_con2_source_schema}
              source_table: customers
              destination_catalog: ${var.del_con2_dest_catalog}
              destination_schema: ${var.del_con2_dest_schema}
          - table:
              source_catalog: ${var.del_con2_source_catalog}
              source_schema: ${var.del_con2_source_schema}
              source_table: products
              destination_catalog: ${var.del_con2_dest_catalog}
              destination_schema: ${var.del_con2_dest_schema}
          - table:
              source_catalog: ${var.del_con2_source_catalog}
              source_schema: ${var.del_con2_source_schema}
              source_table: stores
              destination_catalog: ${var.del_con2_dest_catalog}
              destination_schema: ${var.del_con2_dest_schema}
          - table:
              source_catalog: ${var.del_con2_source_catalog}
              source_schema: ${var.del_con2_source_schema}
              source_table: employees
              destination_catalog: ${var.del_con2_dest_catalog}
              destination_schema: ${var.del_con2_dest_schema}
          - table:
              source_catalog: ${var.del_con2_source_catalog}
              source_schema: ${var.del_con2_source_schema}
              source_table: orders
              destination_catalog: ${var.del_con2_dest_catalog}
              destination_schema: ${var.del_con2_dest_schema}
          - table:
              source_catalog: ${var.del_con2_source_catalog}
              source_schema: ${var.del_con2_source_schema}
              source_table: order_items
              destination_catalog: ${var.del_con2_dest_catalog}
              destination_schema: ${var.del_con2_dest_schema}
          - table:
              source_catalog: ${var.del_con2_source_catalog}
              source_schema: ${var.del_con2_source_schema}
              source_table: payments
              destination_catalog: ${var.del_con2_dest_catalog}
              destination_schema: ${var.del_con2_dest_schema}
          - table:
              source_catalog: ${var.del_con2_source_catalog}
              source_schema: ${var.del_con2_source_schema}
              source_table: shipments
              destination_catalog: ${var.del_con2_dest_catalog}
              destination_schema: ${var.del_con2_dest_schema}
          - table:
              source_catalog: ${var.del_con2_source_catalog}
              source_schema: ${var.del_con2_source_schema}
              source_table: inventory
              destination_catalog: ${var.del_con2_dest_catalog}
              destination_schema: ${var.del_con2_dest_schema}
          - table:
              source_catalog: ${var.del_con2_source_catalog}
              source_schema: ${var.del_con2_source_schema}
              source_table: suppliers
              destination_catalog: ${var.del_con2_dest_catalog}
              destination_schema: ${var.del_con2_dest_schema}
          # 5 tables — liquid clustering disabled (opt out of pipeline AUTO)
          - table:
              source_catalog: ${var.del_con2_source_catalog}
              source_schema: ${var.del_con2_source_schema}
              source_table: purchase_orders
              destination_catalog: ${var.del_con2_dest_catalog}
              destination_schema: ${var.del_con2_dest_schema}
              table_configuration:
                enable_auto_clustering: false
          - table:
              source_catalog: ${var.del_con2_source_catalog}
              source_schema: ${var.del_con2_source_schema}
              source_table: promotions
              destination_catalog: ${var.del_con2_dest_catalog}
              destination_schema: ${var.del_con2_dest_schema}
              table_configuration:
                enable_auto_clustering: false
          - table:
              source_catalog: ${var.del_con2_source_catalog}
              source_schema: ${var.del_con2_source_schema}
              source_table: customer_addresses
              destination_catalog: ${var.del_con2_dest_catalog}
              destination_schema: ${var.del_con2_dest_schema}
              table_configuration:
                enable_auto_clustering: false
          - table:
              source_catalog: ${var.del_con2_source_catalog}
              source_schema: ${var.del_con2_source_schema}
              source_table: product_reviews
              destination_catalog: ${var.del_con2_dest_catalog}
              destination_schema: ${var.del_con2_dest_schema}
              table_configuration:
                enable_auto_clustering: false
          - table:
              source_catalog: ${var.del_con2_source_catalog}
              source_schema: ${var.del_con2_source_schema}
              source_table: returns
              destination_catalog: ${var.del_con2_dest_catalog}
              destination_schema: ${var.del_con2_dest_schema}
              table_configuration:
                enable_auto_clustering: false

  jobs:
    client_a_lakeflow_managed_connect_with_limited_id_job:
      name: job_${var.del_con2_client_id}_del_con2_integrated_cdc
      tags:
        client_name: ${var.del_con2_client_id}
      tasks:
        - task_key: cdc_ingestion
          pipeline_task:
            pipeline_id: ${resources.pipelines.client_a_del_con2_cdc_pipeline.id}
      schedule:
        quartz_cron_expression: '0 0 * * * ?'   # top of every hour (UTC)
        timezone_id: UTC
        pause_status: PAUSED                    # manual trigger only
      max_concurrent_runs: 1
