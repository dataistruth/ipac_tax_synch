# =============================================================================
# resources/jobs/lakeflow_connect_del_con2_ipac.yml
#
# Lakeflow Connect — Integrated CDC pipeline (Beta) + scheduled job
# Connection : sql_server_del_con2_ipac  (etl_reader user)
# Scope      : ONLY the 15 tables granted to etl_reader in schema sales_demo.
#              The 5 restricted tables (employee_salaries,
#              customer_payment_methods, audit_log, internal_costs,
#              vendor_contracts) are intentionally excluded — the connection
#              user has no SELECT on them and including them would fail the
#              pipeline.
#
# Same conventions as lakeflow_connect_job_n_pipeline.yml:
#   - explicit destination_catalog / destination_schema on every table object
#     (Beta applier does not fall back to pipeline-level catalog/schema)
#   - data_staging_options pinned to a dedicated staging schema
# =============================================================================

variables:
  client_id:
    description: 'Client identifier'
    default: client_a
  connection_name:
    description: 'Unity Catalog connection to the source SQL Server'
    default: sql_server_del_con2_ipac
  source_catalog:
    description: 'Source SQL Server database name'
    default: free-sql-db-0862313
  source_schema:
    description: 'Source schema'
    default: sales_demo
  dest_catalog:
    description: 'Destination Unity Catalog catalog'
    default: ipac_tax_synch
  dest_schema:
    description: 'Destination schema for raw synced tables'
    default: client_a_raw_con2
  staging_schema:
    description: 'Schema for the CDC staging volume'
    default: client_a_staging_con2

resources:
  pipelines:
    client_a_del_con2_cdc_pipeline:
      name: ${var.client_id}_del_con2_integrated_cdc
      pipeline_type: MANAGED_INGESTION
      channel: PREVIEW
      serverless: true
      catalog: ${var.dest_catalog}
      schema: ${var.dest_schema}
      ingestion_definition:
        connection_name: ${var.connection_name}
        connector_type: CDC
        data_staging_options:
          catalog_name: ${var.dest_catalog}
          schema_name: ${var.staging_schema}
        objects:
          # primary_keys / sequence_by autodetected from source PKs.
          # destination_table defaults to source_table (no renames needed).
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: customers
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: products
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: stores
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: employees
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: orders
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: order_items
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: payments
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: shipments
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: inventory
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: suppliers
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: purchase_orders
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: promotions
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: customer_addresses
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: product_reviews
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: returns
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}

  jobs:
    client_a_lakeflow_managed_connect_with_limited_id_job:
      name: ${var.client_id}_del_con2_integrated_cdc_job
      tasks:
        - task_key: cdc_ingestion
          pipeline_task:
            pipeline_id: ${resources.pipelines.client_a_del_con2_cdc_pipeline.id}
      schedule:
        quartz_cron_expression: '0 0 * * * ?'   # top of every hour
        timezone_id: UTC
      max_concurrent_runs: 1