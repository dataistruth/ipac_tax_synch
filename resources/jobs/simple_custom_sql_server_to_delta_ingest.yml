# Databricks Asset Bundle / Jobs API job definition
# Job: custom_ingest_and_scd_from_sql_server
#
# Task graph:
#   get_active_tables  ──►  for_each_table ──► ingest_table_scd (per table)
#
# Compute: serverless (no job_clusters)
#
# Deploy with DAB (`databricks bundle deploy`) or translate to the
# Jobs 2.1 JSON via `databricks jobs create --json ...`.

resources:
  jobs:
    custom_ingest_and_scd_from_sql_server:
      name: job_${var.client_id}_custom_scd_ingest
      tags:
        client_name: ${var.client_id}
      max_concurrent_runs: 1

      parameters:
        - name: client_id
          default: client_a
        - name: dest_catalog
          default: ${var.dest_catalog}

      # Serverless task environment (Lakebase + SQL Server helpers)
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - psycopg2-binary

      tasks:
        # ------------------------------------------------------------------ #
        # Task 1: read Lakebase config, emit active table list
        # ------------------------------------------------------------------ #
        - task_key: get_active_tables
          environment_key: default
          notebook_task:
            notebook_path: ../../src/common/notebook1/get_active_tables.py
            base_parameters:
              client_id: "{{job.parameters.client_id}}"
              dest_catalog: "{{job.parameters.dest_catalog}}"

        # ------------------------------------------------------------------ #
        # Task 2: fan out — one iteration per table
        # ------------------------------------------------------------------ #
        - task_key: for_each_table
          depends_on:
            - task_key: get_active_tables
          for_each_task:
            inputs: "{{tasks.get_active_tables.values.active_tables}}"
            concurrency: ${var.ingestion_for_each_concurrency}
            task:
              task_key: ingest_table_scd
              environment_key: default
              notebook_task:
                notebook_path: ../../src/common/notebook1/ingest_tables_from_sql_server_to_delta.py
                base_parameters:
                  table_config: "{{input}}"
                  dest_catalog: "{{job.parameters.dest_catalog}}"

      # Optional: schedule + notifications
      # schedule:
      #   quartz_cron_expression: "0 0 6 * * ?"
      #   timezone_id: America/Chicago
      email_notifications:
        on_failure: []              # add your alert address(es)
